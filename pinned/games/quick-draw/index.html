<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Draw</title>
<!--
  ================================================================
  Quick Draw (formerly Reaction Duel)
  ================================================================
   A reaction-speed shooting game. Five rounds.
   Each round the pad is red and says "Wait for green...".
   When it turns green, SHOOT by tapping the pad as fast as you can.
   Your reaction time is measured from the moment it turns green.
   Tapping while the pad is still red is a false start: the round is replayed.
   Each shot fires a gunshot: a muzzle flash, a screen kick, a recoil of the pad, and a
   bang sound. After 5 shots your average time sets your score (faster = higher).
   Scoring: score = 2000 - average reaction time in ms (best possible 2000, from ../shared/lib/reaction.js).
   Controls: tap or click the pad. Press "Play again" to restart.
   Single player. Best score is saved on this device.
  ================================================================
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #f2f7ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 14px; }
  #stage { position: relative; width: min(90vw, 360px); aspect-ratio: 1; }
  #pad { position: absolute; inset: 0; border-radius: 28px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 22px; font-weight: 700; padding: 20px; cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; transition: background .12s; }
  #pad.ready { background: #7a1f2b; }
  #pad.go { background: #1f9d55; color: #fff; }
  #pad.wait { background: #202a36; }
  #pad.early { background: #5a4a10; }
  #pad.shot { animation: recoil .18s ease-out; }
  @keyframes recoil { 0% { transform: translateY(0); } 30% { transform: translateY(8px) scale(.98); } 100% { transform: translateY(0); } }
  /* muzzle flash: a bright burst that fades quickly */
  #flash { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffe08a 25%, rgba(255,140,40,.6) 50%, rgba(255,140,40,0) 70%);
    opacity: 0; pointer-events: none; }
  #flash.fire { animation: muzzle .22s ease-out; }
  @keyframes muzzle { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.4); } }
  /* a bullet streak from the pad outward */
  #streak { position: absolute; left: 50%; top: 50%; width: 4px; height: 120px; margin-left: -2px; margin-top: -60px;
    background: linear-gradient(180deg, rgba(255,240,180,0), #fff3c4, rgba(255,240,180,0)); opacity: 0; pointer-events: none; }
  #streak.fire { animation: streak .2s ease-out; }
  @keyframes streak { 0% { opacity: 1; transform: translateY(0) scaleY(.4); } 100% { opacity: 0; transform: translateY(-120px) scaleY(1.2); } }
  /* screen kick on every shot */
  body.kick { animation: kick .16s ease-out; }
  @keyframes kick { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,3px); } 50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,1px); } }
  .info { font-size: 15px; color: #a8bdd3; text-align: center; min-height: 1.4em; }
  button { font: inherit; font-weight: 700; color: #0b0f14; background: #5ad1ff; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 44px; cursor: pointer; }
  .hint { font-size: 13px; color: #7f97b0; text-align: center; max-width: 380px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="pad" class="wait" role="button" aria-label="Shoot">Tap to start</div>
  <div id="flash"></div>
  <div id="streak"></div>
</div>
<div class="info" id="info">Five rounds. Shoot when it turns green.</div>
<div class="info" id="best">Best: —</div>
<button id="again" hidden>Play again</button>
<p class="hint">When the pad turns green, tap it to shoot. Tapping early is a false start.</p>
<script type="module">
import { randomDelay, scoreFor } from '../shared/lib/reaction.js';

const ROUNDS = 5;
const KEY = 'quickDraw.best';
const pad = document.getElementById('pad');
const flash = document.getElementById('flash');
const streak = document.getElementById('streak');
const info = document.getElementById('info');
const bestEl = document.getElementById('best');
const again = document.getElementById('again');
let state = 'idle', timer = null, goAt = 0, times = [], round = 0;

// ---- best score on this device (safe if storage is blocked) ----
function readBest() { try { return +(localStorage.getItem(KEY) || 0); } catch (e) { return 0; } }
function saveBest(s) { try { localStorage.setItem(KEY, String(Math.max(s, readBest()))); } catch (e) {} }
bestEl.textContent = readBest() ? `Best: ${readBest()}` : 'Best: —';

// ---- sound: a short synthesised gunshot (noise burst + falling thump), no audio files ----
let ac = null;
function gunshot() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    // crack: white noise through a filter that sweeps down
    const len = Math.floor(ac.sampleRate * 0.25), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = ac.createBufferSource(); src.buffer = buf;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(4000, t); lp.frequency.exponentialRampToValueAtTime(300, t + 0.2);
    const g = ac.createGain(); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    src.connect(lp); lp.connect(g); g.connect(ac.destination); src.start(t);
    // thump: a low sine that drops in pitch
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.18);
    og.gain.setValueAtTime(0.7, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + 0.22);
  } catch (e) { /* no sound available: the animation still plays */ }
}

// ---- shot animation: flash, streak, pad recoil, screen kick ----
function fireAnimation() {
  for (const el of [flash, streak, pad]) { el.classList.remove('fire', 'shot'); void el.offsetWidth; }
  flash.classList.add('fire'); streak.classList.add('fire'); pad.classList.add('shot');
  document.body.classList.remove('kick'); void document.body.offsetWidth; document.body.classList.add('kick');
}

function setPad(cls, text) { pad.className = cls; pad.textContent = text; }

function startRound() {
  round++;
  state = 'wait';
  setPad('ready', 'Wait for green…');
  info.textContent = `Round ${round} of ${ROUNDS}`;
  timer = setTimeout(() => {
    state = 'go'; goAt = performance.now();
    setPad('go', 'SHOOT!');
  }, randomDelay());
}

pad.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state === 'idle') { times = []; round = 0; return startRound(); }
  if (state === 'wait') {                       // fired too early
    clearTimeout(timer);
    gunshot(); fireAnimation();
    setPad('early', 'Too early! Wait for green.');
    info.textContent = 'False start. Try this round again.';
    round--;
    state = 'early';
    setTimeout(() => { if (state === 'early') { state = 'idle'; setPad('wait', 'Tap to try again'); } }, 900);
    return;
  }
  if (state === 'go') {                         // the shot on green
    const ms = Math.round(performance.now() - goAt);
    times.push(ms);
    gunshot(); fireAnimation();
    if (times.length >= ROUNDS) return finish();
    state = 'between';
    setPad('wait', `${ms} ms`);
    setTimeout(() => { if (state === 'between') startRound(); }, 900);
  }
});

function finish() {
  state = 'done';
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  const score = scoreFor(avg);
  saveBest(score);
  // Report the score to the Pinned app's Scores panel (only when inside it).
  if (window.parent !== window) { try { window.parent.postMessage({ pinned: 1, t: 'over', score }, location.origin); } catch (e) { /* ignore */ } }
  setPad('wait', `Average ${avg} ms`);
  info.textContent = `Your times: ${times.join(' · ')} ms`;
  bestEl.textContent = `Score ${score} · Best ${readBest()}`;
  again.hidden = false;
}

again.onclick = () => { state = 'idle'; round = 0; times = []; again.hidden = true; bestEl.textContent = readBest() ? `Best: ${readBest()}` : 'Best: —'; setPad('wait', 'Tap to start'); info.textContent = 'Five rounds. Shoot when it turns green.'; };
</script>
</body>
</html>

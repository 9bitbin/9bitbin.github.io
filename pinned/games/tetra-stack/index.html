<!doctype html>
<html lang="en">
<head>
<!--
  ================================================================
  Tetra Stack
  ================================================================
   Tetra Stack (formerly Block Drop). A falling-block puzzle, like classic Tetris.
   Coloured pieces (made of 4 squares) fall down a 10x20 grid. Move and rotate them to fill
   complete rows. Full rows vanish and score points. Clearing 4 rows at once is a "Quad".
   Every 10 lines the level goes up and the pieces fall faster. Game over when a new piece
   has no room at the top.
   Controls: on-screen buttons, or keyboard (arrows to move and rotate, space to hard drop),
   or swipe on the board (swipe sideways to move, swipe down to hard drop, tap to rotate).
   Scoring: 1 line 100, 2 lines 300, 3 lines 500, 4 lines 800, all times the level.
   Soft drop +1 per row, hard drop +2 per row.
   Single player. Best score is saved on this device.
  ================================================================
-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tetra Stack</title>
<style>
  :root { --ink:#eaf0ff; --panel:#121529; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0c18; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; }
  .hud { display:flex; gap:14px; align-items:center; justify-content:center; padding:6px 10px; font-weight:800; font-size:14px; width:100%; flex-wrap:wrap; }
  .hud b { color:#7cc4ff; }
  canvas#board { display:block; background:var(--panel); border-radius:10px; box-shadow:0 10px 30px -10px rgba(0,0,0,.7); touch-action:none; }
  .side { display:flex; gap:12px; align-items:center; font-size:12px; color:#9fb0d8; }
  .next { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .controls { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:10px 12px calc(env(safe-area-inset-bottom) + 12px); width:100%; max-width:440px; }
  .controls button { border:0; border-radius:14px; background:#1c2140; color:#eaf0ff; font-size:24px; font-weight:800; padding:14px 0; }
  .controls button:active { background:#2a3160; }
  .controls .wide { grid-column: span 2; }
  .panel { position:fixed; inset:0; display:grid; place-items:center; padding:24px; pointer-events:none; }
  .card { pointer-events:auto; background:#141833; border:1px solid #2a3160; border-radius:18px; padding:22px; width:min(320px,100%); text-align:center; }
  .card h1 { margin:0 0 6px; font-size:28px; }
  .card p { margin:6px 0; color:#9fb0d8; line-height:1.4; }
  .big { font-size:44px; font-weight:900; color:#7cc4ff; margin:6px 0; }
  .card button { font:inherit; font-weight:800; font-size:18px; border:0; border-radius:999px; padding:12px 26px; margin-top:12px; background:#3e63dd; color:#fff; }
  .card button:active { transform:translateY(1px); }
  [hidden] { display:none !important; }
</style>
<script src="../shared/solo.js"></script>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <div>Score <b id="score">0</b></div>
    <div>Lines <b id="lines">0</b></div>
    <div>Lvl <b id="level">1</b></div>
    <div class="next">Next<canvas id="next" width="60" height="60"></canvas></div>
  </div>
  <canvas id="board"></canvas>
  <div class="controls" id="controls">
    <button id="bLeft" aria-label="Left">◀</button>
    <button id="bRot" aria-label="Rotate">⟳</button>
    <button id="bRight" aria-label="Right">▶</button>
    <button id="bDown" aria-label="Soft drop">▼</button>
    <button id="bDrop" class="wide" aria-label="Hard drop">Drop ⤓</button>
    <button id="bHold" class="wide" aria-label="Pause">Pause</button>
  </div>
</div>
<div class="panel" id="startPanel">
  <div class="card">
    <h1>🟦 Tetra Stack</h1>
    <p>Clear lines by filling rows. Four in one go is a <b>Quad</b>!</p>
    <p>Buttons below, or on a keyboard: ← → to move, ↑ rotate, ↓ soft drop, space to slam.</p>
    <button id="startBtn">Start</button>
  </div>
</div>
<div class="panel" id="overPanel" hidden>
  <div class="card">
    <h1 id="overTitle">Stack topped out!</h1>
    <div class="big" id="finalScore">0</div>
    <p id="finalSub"></p>
    <button id="againBtn">Play again</button>
    <p id="waitMsg" hidden>Waiting for everyone to finish…</p>
  </div>
</div>
<script>
(() => {
  const PB = window.PB;
  const $ = (id) => document.getElementById(id);
  const COLS = 10, ROWS = 20;
  const bd = $("board"), ctx = bd.getContext("2d");
  const nx = $("next"), nctx = nx.getContext("2d");
  let cell = 24, px = 1;

  // tetromino shapes (4 rotations each), SRS-ish
  const SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
    O: [[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
    T: [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    S: [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
    J: [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]],
  };
  const COLORS = { I:"#4fd8e8", O:"#ffd54f", T:"#b983ff", S:"#5be58a", Z:"#ff6b7a", J:"#5a8cff", L:"#ffa24f" };
  const KEYS = Object.keys(SHAPES);

  function resize() {
    px = Math.min(devicePixelRatio || 1, 2);
    const availH = innerHeight - 170, availW = innerWidth - 24;
    cell = Math.max(14, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    bd.style.width = (cell*COLS)+"px"; bd.style.height = (cell*ROWS)+"px";
    bd.width = cell*COLS*px; bd.height = cell*ROWS*px;
    nx.width = 60*px; nx.height = 60*px; nx.style.width="60px"; nx.style.height="60px";
  }
  addEventListener("resize", resize); resize();

  // ---- sound ----
  let ac=null;
  const beep=(f,d=.07,t="square",v=.08,f2)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.02);}catch(e){}};

  // ---- state ----
  let grid, cur, nextPiece, bag, rnd, score, lines, level, dropMs, acc, phase="intro", over=false;
  function newBag() { const b = KEYS.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
  function pull() { if (!bag.length) bag = newBag(); return bag.shift(); }
  function spawn() {
    cur = { k: nextPiece, r: 0, x: 3, y: 0 };
    nextPiece = pull();
    if (collides(cur.x, cur.y, cur.r)) { topOut(); return; }
    drawNext();
  }
  function cells(p=cur) { return SHAPES[p.k][p.r].map(([x,y]) => [p.x+x, p.y+y]); }
  function collides(x,y,r) {
    for (const [cx,cy] of SHAPES[cur.k][r]) {
      const gx=x+cx, gy=y+cy;
      if (gx<0||gx>=COLS||gy>=ROWS) return true;
      if (gy>=0 && grid[gy][gx]) return true;
    }
    return false;
  }
  function lock() {
    for (const [x,y] of cells()) if (y>=0) grid[y][x] = cur.k;
    let cleared=0;
    for (let y=ROWS-1;y>=0;) {
      if (grid[y].every(c=>c)) { grid.splice(y,1); grid.unshift(Array(COLS).fill(0)); cleared++; }
      else y--;
    }
    if (cleared) {
      lines += cleared; score += [0,100,300,500,800][cleared] * level;
      beep(cleared>=4?880:520, cleared>=4?.25:.1, "triangle", .12, cleared>=4?1320:780);
      level = 1 + Math.floor(lines/10); dropMs = Math.max(80, 800 - (level-1)*70);
      syncHud(); report(true);
    } else beep(180,.05,"square",.05);
    spawn();
  }
  function topOut() { over=true; phase="over"; finish(); }

  const STEP_PTS = () => {};
  function tryMove(dx,dy) { if (!collides(cur.x+dx, cur.y+dy, cur.r)) { cur.x+=dx; cur.y+=dy; return true; } return false; }
  function rotate() {
    const nr=(cur.r+1)%4;
    for (const kick of [0,-1,1,-2,2]) { if (!collides(cur.x+kick, cur.y, nr)) { cur.x+=kick; cur.r=nr; beep(440,.04,"sine",.04); draw(); return; } }
  }
  function softDrop() { if (tryMove(0,1)) { score+=1; syncHud(); } else lock(); }
  function hardDrop() { let n=0; while (tryMove(0,1)) n++; score+=n*2; syncHud(); beep(260,.06,"square",.06,140); lock(); }

  function syncHud() { $("score").textContent=score; $("lines").textContent=lines; $("level").textContent=level; }
  function report(force) { PB.state({ d: lines, score, alive: !over }, force); }

  function start() {
    rnd = PB.rng(PB.race ? PB.seed : (Math.random()*4294967296)>>>0);
    grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
    bag=[]; nextPiece=pull(); score=0; lines=0; level=1; dropMs=800; acc=0; over=false; phase="play";
    $("startPanel").hidden=true; $("overPanel").hidden=true;
    syncHud(); spawn(); report(true); last=performance.now();
  }
  function finish() {
    report(true); PB.send("over",{score});
    const best = Math.max(score, +(localStorage.getItem("pinned.blocks.best")||0));
    try{localStorage.setItem("pinned.blocks.best",best);}catch(e){}
    $("finalScore").textContent=score;
    $("finalSub").textContent = `${lines} lines` + (PB.race ? "" : ` · best ${best}`);
    $("againBtn").hidden = PB.race; $("waitMsg").hidden = !PB.race;
    $("overPanel").hidden=false;
    if (ac) beep(200,.3,"sawtooth",.08,90);
  }

  // ---- input ----
  const act = (fn) => (e) => { if(e){e.preventDefault();} if(phase==="play"){ beep; fn(); draw(); } };
  $("bLeft").onclick = act(()=>tryMove(-1,0));
  $("bRight").onclick = act(()=>tryMove(1,0));
  $("bRot").onclick = act(rotate);
  $("bDown").onclick = act(softDrop);
  $("bDrop").onclick = act(hardDrop);
  $("bHold").onclick = () => { if(phase==="play"){phase="pause";$("bHold").textContent="Resume";} else if(phase==="pause"){phase="play";$("bHold").textContent="Pause";last=performance.now();} };
  addEventListener("keydown",(e)=>{
    if (phase!=="play") return;
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
    if (e.key==="ArrowLeft") tryMove(-1,0);
    else if (e.key==="ArrowRight") tryMove(1,0);
    else if (e.key==="ArrowUp") rotate();
    else if (e.key==="ArrowDown") softDrop();
    else if (e.key===" ") hardDrop();
    draw();
  });
  // swipe on the board
  let tS=null;
  bd.addEventListener("pointerdown",(e)=>{ tS={x:e.clientX,y:e.clientY,t:Date.now(),moved:false}; });
  bd.addEventListener("pointermove",(e)=>{ if(!tS||phase!=="play")return; const dx=e.clientX-tS.x; if(Math.abs(dx)>cell){ tryMove(dx>0?1:-1,0); tS.x=e.clientX; tS.moved=true; draw(); } });
  bd.addEventListener("pointerup",(e)=>{ if(!tS||phase!=="play"){tS=null;return;} const dx=e.clientX-tS.x, dy=e.clientY-tS.y, dt=Date.now()-tS.t;
    if(!tS.moved){ if(dy>cell*2&&dt<300) hardDrop(); else if(Math.abs(dy)<10&&Math.abs(dx)<10) rotate(); } draw(); tS=null; });

  $("startBtn").onclick = start;
  $("againBtn").onclick = start;
  if (PB.race) { $("startPanel").hidden=true; PB.on("go", start); }

  // ---- draw ----
  function block(c, x, y, k, g=1) {
    const col = COLORS[k]; c.globalAlpha=g;
    c.fillStyle=col; c.fillRect(x+1,y+1,cell-2,cell-2);
    c.fillStyle="rgba(255,255,255,.25)"; c.fillRect(x+1,y+1,cell-2,3);
    c.fillStyle="rgba(0,0,0,.22)"; c.fillRect(x+1,y+cell-4,cell-2,3);
    c.globalAlpha=1;
  }
  function draw() {
    ctx.setTransform(px,0,0,px,0,0);
    ctx.fillStyle="#121529"; ctx.fillRect(0,0,COLS*cell,ROWS*cell);
    if(!grid){ return; }
    ctx.strokeStyle="rgba(255,255,255,.04)"; ctx.lineWidth=1;
    for (let x=1;x<COLS;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,ROWS*cell);ctx.stroke();}
    for (let y=1;y<ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(COLS*cell,y*cell);ctx.stroke();}
    for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) if (grid[y][x]) block(ctx,x*cell,y*cell,grid[y][x]);
    if (cur && phase!=="over") {
      // ghost landing spot
      let gy=0; while(!collides(cur.x,cur.y+gy+1,cur.r)) gy++;
      for (const [x,y] of SHAPES[cur.k][cur.r]) if(cur.y+y+gy>=0) block(ctx,(cur.x+x)*cell,(cur.y+y+gy)*cell,cur.k,.18);
      for (const [x,y] of cells()) if(y>=0) block(ctx,x*cell,y*cell,cur.k);
    }
    if (phase==="pause"){ ctx.fillStyle="rgba(10,12,24,.7)"; ctx.fillRect(0,0,COLS*cell,ROWS*cell); ctx.fillStyle="#fff"; ctx.font="800 22px system-ui"; ctx.textAlign="center"; ctx.fillText("Paused",COLS*cell/2,ROWS*cell/2); }
  }
  function drawNext() {
    nctx.setTransform(px,0,0,px,0,0); nctx.clearRect(0,0,60,60);
    const s=13, pts=SHAPES[nextPiece][0]; let minx=9,miny=9,maxx=0,maxy=0;
    for(const[x,y]of pts){minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y);}
    const ox=(60-(maxx-minx+1)*s)/2-minx*s, oy=(60-(maxy-miny+1)*s)/2-miny*s;
    nctx.fillStyle=COLORS[nextPiece];
    for(const[x,y]of pts){nctx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2);}
  }

  window.__cur=()=>cur&&cur.k; window.__lines=()=>lines;
  let last=performance.now();
  function loop(now) {
    if (phase==="play") {
      acc += now-last;
      while (acc>=dropMs) { acc-=dropMs; if(!tryMove(0,1)) { lock(); break; } }
    }
    last=now;
    if (phase!=="intro") draw();
    requestAnimationFrame(loop);
  }
  draw(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!doctype html>

<head>
<!--
  ================================================================
  Parry Brawl
  ================================================================
   A side-view platform fighter in the style of Brawlhalla. You fight one computer opponent.
   Each fighter has 3 stocks. Knock the other off the stage to take a stock. Damage builds up
   as a percentage, and the higher it is, the further hits send a fighter flying.
   Parry (L): press it a split second before an attack lands. If it lands inside your shield
   window, the hit is blocked, the attacker is stunned, and your next hit does extra damage.
   Scoring: each knockout +100, each stock left +250, winning +500.
   Controls: A/D or arrows move. W, Up or Space jump (twice in the air). S + jump drops through a ledge.
   J light attack. K heavy attack (Up + K for an upward smash). L parry. M mute. Enter or click starts.
   Single player. Best score is saved on this device.
  ================================================================
-->

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; background: #0e0a24; }
</style>

  f.pal = { gi: d.gi, gi2: d.gi2, trim: d.trim, sash: d.sash, scarf: d.scarf, hakama: d.hakama, hair: d.hair,

// ---- items: weapons, gloves and bombs. Throw (middle click or V) picks up when empty-handed, and throws when holding.
// Down + throw drops the item at your feet instead.
const WEAPON_STATS = {
  short: { name: "Short blade", dmg: 3, w: 18, startupMul: 1, len: 0.9 },
  long:  { name: "Longsword", dmg: 7, w: 32, startupMul: 1, len: 1.15 },
  great: { name: "Greatsword", dmg: 13, w: 50, startupMul: 1.35, len: 1.45 },
};
const ITEM_WEIGHTS = [["short", 3], ["long", 3], ["great", 2], ["bomb", 2], ["gloves", 2]];
const SPAWN_MIN = 1080, SPAWN_RANGE = 600;          // a new item every 18 to 28 seconds
const GROUND_LIFE = 240, SPAWN_LIFE = 600, FADE_T = 24, FUSE_T = 120;
const BLAST_R = 115, GLOVE_T = 720, MAX_ITEMS = 3;
let items = [];
let nextSpawnT = SPAWN_MIN + Math.floor(Math.random() * SPAWN_RANGE);

// Attack data for this fighter's current weapon. Fists use the base numbers; gloves add damage.
function cfgFor(f, kind) {
  const base = ATK[kind];
  const w = f.held && WEAPON_STATS[f.held.type];
  const glove = f.gloves > 0 ? 1.4 : 1;
  const cfg = { ...base, dmg: base.dmg * glove };
  if (w) {
    cfg.dmg = (base.dmg + w.dmg) * glove;
    cfg.w = base.w + w.w;
    if (w.startupMul !== 1) {
      cfg.startup = Math.round(base.startup * w.startupMul);
      cfg.total = base.total + (cfg.startup - base.startup);
    }
  }
  return cfg;
}
function noiseSfx(dur, freq, vol) {
  if (muted || !ac) return;
  try {
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 1.2;
    const gn = ac.createGain(); gn.gain.value = vol * settings.sfx;
    s.connect(bp); bp.connect(gn); gn.connect(ac.destination); s.start();
  } catch (e) {}
}
function makeItem(type, x, y, st, life, owner) {
  return { type, x, y, py: y, vx: 0, vy: 0, st, age: 0, life, fadeT: 0, fuse: null, owner, gone: false };
}
function pickType() {
  const total = ITEM_WEIGHTS.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [t, w] of ITEM_WEIGHTS) { if ((r -= w) < 0) return t; }
  return "short";
}
function spawnItem() {
  if (items.filter((i) => i.st !== "fade").length >= MAX_ITEMS) return;
  const it = makeItem(pickType(), 300 + Math.random() * 360, -30, "fall", SPAWN_LIFE, null);
  it.vy = 1.5; items.push(it);
}
function dropItem(type, x, y, vx, vy, armed, owner) {
  const it = makeItem(type, x, y, "flying", GROUND_LIFE, owner);
  it.vx = vx; it.vy = vy;
  if (type === "bomb" && armed) it.fuse = FUSE_T;
  items.push(it);
  return it;
}
function nearestItem(f) {
  let best = null, bd = 320;
  for (const it of items) {
    if (it.st !== "rest" || it.fuse !== null) continue;
    const d = Math.abs(it.x - f.x);
    if (d < bd) { best = it; bd = d; }
  }
  return best;
}
function pickupNear(f) {
  let best = null, bd = 1e9;
  for (const it of items) {
    if (it.st !== "rest" || it.fuse !== null) continue;
    const dx = Math.abs(it.x - f.x), dy = Math.abs(it.y - (f.y - 30));
    if (dx < 46 && dy < 60 && dx < bd) { best = it; bd = dx; }
  }
  if (!best) return false;
  best.gone = true;
  if (best.type === "gloves") { f.gloves = GLOVE_T; addText(f.x, f.y - 100, "GLOVES ON", "#ff6f6f", 1.1); }
  else { f.held = { type: best.type }; addText(f.x, f.y - 100, WEAPON_STATS[best.type] ? WEAPON_STATS[best.type].name : "Bomb", "#ffe066", 1); }
  beep(700, 0.06, "sine", 0.05);
  return true;
}
function throwHeld(f) {
  const h = f.held; f.held = null;
  const armed = h.type === "bomb";
  if (f.in.d) dropItem(h.type, f.x + f.face * 6, f.y - 6, 0, 0, armed, f);
  else {
    const up = f.in.u;
    dropItem(h.type, f.x + f.face * 22, f.y - 40, f.face * (up ? 4 : 8), up ? -9 : -4, armed, f);
  }
  beep(520, 0.05, "triangle", 0.04);
}
function landItem(it) {
  for (const p of PLATS) {
    if (it.x > p.x && it.x < p.x + p.w && it.py <= p.y + 0.01 && it.y >= p.y) {
      it.y = p.y; it.vy = 0; it.vx = 0; it.st = "rest"; it.age = 0;
      return;
    }
  }
}
// A thrown weapon hits a fighter (or bounces off a parry) once, then lies on the ground.
function itemHit(it) {
  if (it.st !== "flying" || !WEAPON_STATS[it.type]) return;
  for (const f of [player, ai]) {
    if (it.owner === f && it.age < 14) continue;
    if (!overlap({ x0: it.x - 12, x1: it.x + 12, y0: it.y - 12, y1: it.y + 12 }, bodyBox(f))) continue;
    if (f.state === "parry" && f.t >= 1 && f.t <= PARRY_WINDOW) {
      it.vx = -it.vx; it.vy = -3; it.owner = f; it.age = 0;
      addText(f.x, f.y - 92, "PARRY!", "#ffe066", 1.2); beep(990, 0.12, "triangle", 0.08);
      return;
    }
    if (f.invuln > 0) continue;
    f.dmg += WEAPON_STATS[it.type].dmg * 0.8;
    const dir = it.vx >= 0 ? 1 : -1, kb = 4 + f.dmg * 0.07;
    Object.assign(f, { vx: dir * kb, vy: -kb * 0.5, state: "hurt", t: 0, stunT: 20 + Math.round(kb * 1.5), kind: null,
      grounded: false, plat: null, flash: 6, lastHitBy: it.owner, lastHitTick: tick });
    f.y -= 2;
    burst(f.x, f.y - 36, "#ffffff", 10); shake = 5; noiseSfx(0.09, 1800, 0.1);
    Object.assign(it, { st: "rest", age: 0, life: GROUND_LIFE, vx: 0, vy: 0, owner: null });
    return;
  }
}
function explode(x, y, owner) {
  shake = 12; burst(x, y, "#ffb347", 30); noiseSfx(0.6, 160, 0.25); beep(90, 0.4, "sawtooth", 0.07);
  addText(clamp(x, 90, W - 90), y - 40, "BOOM", "#ffb347", 1.4);
  for (const f of [player, ai]) {
    const dx = f.x - x, dy = (f.y - 30) - y, d = Math.hypot(dx, dy);
    if (d > BLAST_R || f.invuln > 0) continue;
    f.dmg += 8 + 16 * (1 - d / BLAST_R);
    if (owner) { f.lastHitBy = owner; f.lastHitTick = tick; }
    const dir = dx >= 0 ? 1 : -1, kb = 5 + f.dmg * 0.07;
    Object.assign(f, { vx: dir * kb, vy: -kb * 0.9, state: "hurt", t: 0, stunT: 30, kind: null, grounded: false, plat: null, flash: 8 });
    f.y -= 2;
    burst(f.x, f.y - 30, "#ffb347", 14);
  }
}
function updateItems() {
  for (const it of items) {
    it.age++; it.py = it.y;
    if (it.st === "fall" || it.st === "flying") {
      it.vy = Math.min(MAXFALL, it.vy + (it.st === "fall" ? G * 0.6 : G * 0.7));
      it.x += it.vx; it.y += it.vy;
      if (it.st === "flying") itemHit(it);
      if (it.st !== "rest" && it.vy >= 0) landItem(it);
    } else if (it.st === "rest") {
      if (it.age >= it.life) { it.st = "fade"; it.fadeT = 0; }
    } else if (it.st === "fade") it.fadeT++;
    if (it.fuse !== null && it.st !== "fade") {
      it.fuse--;
      if (it.fuse <= 0) { explode(it.x, it.y - 8, it.owner); it.gone = true; }
    }
    if (it.y > H + 60 || it.x < -60 || it.x > W + 60) it.gone = true;
  }
  items = items.filter((it) => !it.gone && !(it.st === "fade" && it.fadeT >= FADE_T));
  if (--nextSpawnT <= 0) { spawnItem(); nextSpawnT = SPAWN_MIN + Math.floor(Math.random() * SPAWN_RANGE); }
}
function drawItems() {
  for (const it of items) {
    if (it.st === "fall") {
      const p = PLATS[0], pulse = 6 + Math.sin(tick * 0.3) * 2;
      g.save(); g.strokeStyle = "rgba(255,224,102,.85)"; g.lineWidth = 2;
      g.beginPath(); g.ellipse(it.x, p.y - 2, pulse + 6, 4, 0, 0, 6.28); g.stroke(); g.restore();
      continue;
    }
    g.save();
    const fa = it.st === "fade" ? 1 - it.fadeT / FADE_T : 1;
    g.globalAlpha = fa;
    if (it.st === "fade") { g.shadowColor = "#ff7a1a"; g.shadowBlur = 16 * fa; }
    g.translate(it.x, it.y);
    if (it.type === "gloves") {
      g.fillStyle = "#d32f2f"; g.beginPath(); g.arc(-6, -8, 6, 0, 6.28); g.arc(6, -8, 6, 0, 6.28); g.fill();
      g.fillStyle = "#ffd54f"; g.fillRect(-11, -3, 22, 3);

// ---- state timers

  if (f.held && f.held.type === "bomb") {
    g.fillStyle = "#1a1a1a"; g.beginPath(); g.arc(hand.x + 2, hand.y - 4, 6, 0, 6.28); g.fill();
    g.strokeStyle = "#8a6a4a"; g.lineWidth = 1.6; g.beginPath(); g.moveTo(hand.x + 3, hand.y - 9); g.lineTo(hand.x + 6, hand.y - 13); g.stroke();
    g.fillStyle = P.skin; g.beginPath(); g.arc(hand.x, hand.y, 3.2, 0, 6.28); g.fill();
  } else if (f.held) {
    const ws = WEAPON_STATS[f.held.type], tx = hand.x + ux * ws.len * 40, ty = hand.y + uy * ws.len * 40;
    g.strokeStyle = "#2a1a14"; g.lineWidth = 3.5; g.beginPath(); g.moveTo(hand.x - ux * 7, hand.y - uy * 7); g.lineTo(hand.x, hand.y); g.stroke();
    g.strokeStyle = P.weapon; g.lineWidth = 3; g.beginPath(); g.moveTo(hand.x + nx * 6, hand.y + ny * 6); g.lineTo(hand.x - nx * 6, hand.y - ny * 6); g.stroke();
    if (active) { g.shadowColor = "#ffffff"; g.shadowBlur = 10; }
    g.strokeStyle = P.blade; g.lineWidth = f.held.type === "great" ? 4.4 : f.held.type === "long" ? 3.6 : 2.8; g.beginPath(); g.moveTo(hand.x, hand.y);
    if (P.curved) g.quadraticCurveTo((hand.x + tx) / 2 + nx * 7, (hand.y + ty) / 2 + ny * 7, tx, ty); else g.lineTo(tx, ty);
    g.stroke();
    g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = 1; g.beginPath(); g.moveTo(hand.x + nx * 0.8, hand.y + ny * 0.8); g.lineTo(tx + nx * 0.8, ty + ny * 0.8); g.stroke();
    g.shadowBlur = 0;
    g.fillStyle = P.skin; g.beginPath(); g.arc(hand.x, hand.y, 3.6, 0, 6.28); g.fill();
  } else {
    // bare fists, in gloves while the boost lasts
    if (active) { g.shadowColor = "#ffffff"; g.shadowBlur = 10; }
    const gl = f.gloves > 0;
    g.fillStyle = gl ? "#d32f2f" : P.skin; g.beginPath(); g.arc(hand.x, hand.y, gl ? 5.6 : 4.2, 0, 6.28); g.fill();
    if (gl) { g.fillStyle = "#ffd54f"; g.fillRect(hand.x - 4, hand.y + 2, 8, 2.2); }
    g.shadowBlur = 0;
  }

  drawBodyExtras(f, P);
  drawHead(f, P);
  drawHeadExtras(f, P);
  g.restore();

  // parry shield, bright while its window is open
  if (f.state === "parry") {
    const open = f.t >= 1 && f.t <= PARRY_WINDOW;
    g.strokeStyle = open ? "#ffe066" : "#9bd4ff"; g.lineWidth = open ? 5 : 3;
    g.beginPath(); g.arc(6, -30, 34, 0, 6.28); g.stroke();
  }
  if (f.flash > 0) { g.fillStyle = "rgba(255,255,255,.55)"; rr(-16, -46, 32, 46, 9); g.fill(); }
  g.restore();

  if (f.preview) return;
  const pct = Math.round(f.dmg);
  g.textAlign = "center"; g.font = "bold 16px system-ui, sans-serif";
  g.fillStyle = pct >= 100 ? "#ff6b6b" : pct >= 50 ? "#ffb347" : "#ffffff";
  g.fillText(`${pct}%`, x, y - 102);
}
function drawEffects() {
  for (const s of sparks) { g.globalAlpha = Math.min(1, s.life / 20); g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, 3, 0, 6.28); g.fill(); }
  g.globalAlpha = 1;
  g.textAlign = "center";
  for (const t of texts) { g.globalAlpha = Math.min(1, t.life / 25); g.fillStyle = t.c; g.font = `bold ${Math.round(26 * t.size)}px system-ui, sans-serif`; g.fillText(t.s, t.x, t.y); }
  g.globalAlpha = 1;
}
function drawHUD() {
  hudFor(player, 24, "left"); hudFor(ai, W - 24, "right"); hudItem(player, 24, "left"); hudItem(ai, W - 24, "right");
  g.textAlign = "center"; g.fillStyle = "rgba(255,255,255,.6)"; g.font = "13px system-ui, sans-serif";
  g.fillText(SCHEMES[scheme].hint + " · M mute", W / 2, H - 12);
}
function hudFor(f, x, side) {
  g.save(); g.textAlign = side === "left" ? "left" : "right";
  g.font = "bold 18px system-ui, sans-serif"; g.fillStyle = f.color; g.fillText(f.name, x, 34);
  g.font = "bold 28px system-ui, sans-serif"; g.fillStyle = "#ffffff"; g.fillText(`${Math.round(f.dmg)}%`, x, 66);
  for (let i = 0; i < 3; i++) {
    const sx = side === "left" ? x + 6 + i * 20 : x - 6 - i * 20;
    g.fillStyle = i < f.stocks ? f.color : "rgba(255,255,255,.2)";
    g.beginPath(); g.arc(sx, 84, 7, 0, 6.28); g.fill();
  }
  g.restore();
}
// ---- menus: main menu, settings and how to play. Each can be used with the keyboard or the mouse.
const MENU = [
  { label: "Play", run: () => { state = "pick"; pickIdx = 0; } },
  { label: "Multiplayer (coming soon)", run: () => flashNote("Multiplayer is coming soon"), dim: true },
  { label: "Settings", run: () => { state = "settings"; setIdx = 0; } },
  { label: "How to play", run: () => { state = "help"; } },
];
const SETROWS = ["music", "sfx", "narrator", "sound", "controls", "back"];
const HELP_FOR = {
  mkb: [
    ["Move", ["A / D walk · W jump (twice in the air) · S + jump drops through a ledge", "Left Shift: dodge, a quick sidestep that avoids hits"]],
    ["Attack", ["Left click: quick light attack · Right click: heavy · aim above you for an upward smash"]],
    ["Parry", ["E: press just before a hit lands", "It blocks the hit, stuns the attacker, and boosts your next hit"]],
    ["Taunt", ["1 2 3 4: taunts, with a line of speech"]],
    ["Throw", ["Middle click: pick up / throw items. Down + throw drops at your feet"]],
    ["Keys", ["Tab or B: show fighter names · Esc or Enter: pause · Q quits to the menu from pause · M mute · N narrator"]],
  ],
  kba: [
    ["Move", ["Arrow keys walk and jump · Down + jump drops through a ledge", "Z: dodge, a quick sidestep that avoids hits"]],
    ["Attack", ["C: quick light attack · X: heavy · Up + X: upward smash", "Mouse also works: left click light · right click heavy"]],
    ["Parry", ["Right Shift: press just before a hit lands", "It blocks the hit, stuns the attacker, and boosts your next hit"]],
    ["Taunt", ["1 2 3 4: taunts, with a line of speech"]],
    ["Throw", ["V: pick up / throw items. Down + V drops at your feet"]],
    ["Keys", ["Tab or B: show fighter names · Esc or Enter: pause · Q quits to the menu from pause · M mute · N narrator"]],
  ],
};

function flashNote(s) { menuNote = s; menuNoteT = 150; }
function setSetting(k, v) { settings[k] = Math.round(clamp(v, 0, 1) * 20) / 20; saveSettings(); if (k === "music") applyMusicVol(); }
function adjustRow(k, dir) {
  if (k === "music" || k === "sfx") {
    if (dir) setSetting(k, settings[k] + dir * 0.1);
    if (k === "sfx") beep(660, 0.08, "triangle", 0.08);   // a sample so you can hear the level
  } else if (k === "narrator") { settings.narrator = !settings.narrator; saveSettings(); }
  else if (k === "sound") setMuted(!muted);
  else if (k === "controls") setScheme(scheme === "mkb" ? "kba" : "mkb");
  else if (k === "back") state = "menu";
}
function menuKey(e) {
  const c = e.code;
  const up = c === "ArrowUp" || c === "KeyW", down = c === "ArrowDown" || c === "KeyS";
  const left = c === "ArrowLeft" || c === "KeyA", right = c === "ArrowRight" || c === "KeyD";
  const ok = c === "Enter" || c === "Space" || c === "KeyJ", back = c === "Escape" || c === "Backspace";
  if (c === "KeyN") { narrate(true); return; }
  if (state === "menu") {
    if (up) menuIdx = (menuIdx + MENU.length - 1) % MENU.length;
    else if (down) menuIdx = (menuIdx + 1) % MENU.length;
    else if (ok && !e.repeat) MENU[menuIdx].run();
  } else if (state === "pick") {
    const n = ROSTER.length, cols = 5;
    if (left) pickIdx = (pickIdx + n - 1) % n;
    else if (right) pickIdx = (pickIdx + 1) % n;
    else if (up) pickIdx = (pickIdx - cols + n) % n;
    else if (down) pickIdx = (pickIdx + cols) % n;
    else if (ok && !e.repeat) confirmPick();
    else if (back) state = "menu";
  } else if (state === "settings") {
    if (up) setIdx = (setIdx + SETROWS.length - 1) % SETROWS.length;
    else if (down) setIdx = (setIdx + 1) % SETROWS.length;
    else if (left || right) adjustRow(SETROWS[setIdx], right ? 1 : -1);
    else if (ok && !e.repeat) adjustRow(SETROWS[setIdx], 0);
    else if (back) state = "menu";
  } else if (state === "help") {
    if (back || (ok && !e.repeat)) state = "menu";
  }
}
function btn(x, y, w, h, label, { sel = false, dim = false, idx, onClick } = {}) {
  g.save();
  g.fillStyle = sel ? "rgba(255,224,102,.22)" : "rgba(255,255,255,.07)";
  g.strokeStyle = sel ? "#ffe066" : "rgba(255,255,255,.25)"; g.lineWidth = sel ? 3 : 2;
  rr(x, y, w, h, 14); g.fill(); g.stroke();
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = dim ? "rgba(255,255,255,.4)" : sel ? "#ffe066" : "#f4eefc";
  // Shrink long labels so they fit inside the button.
  let size = 22;
  g.font = `bold ${size}px system-ui, sans-serif`;
  while (size > 12 && g.measureText(label).width > w - 24) { size--; g.font = `bold ${size}px system-ui, sans-serif`; }
  g.fillText(label, x + w / 2, y + h / 2);
  g.restore();
  if (onClick) hits.push({ x, y, w, h, idx, click: onClick });
}
function drawMenu() {
  g.fillStyle = "rgba(10,6,25,.94)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.fillStyle = "#ffe066"; g.font = "bold 64px system-ui, sans-serif"; g.fillText("PARRY BRAWL", W / 2, 130);
  g.fillStyle = "rgba(244,238,252,.8)"; g.font = "18px system-ui, sans-serif"; g.fillText("A platform fighter. Parry to win.", W / 2, 170);
  MENU.forEach((m, i) => btn(W / 2 - 150, 210 + i * 64, 300, 52, m.label, { sel: menuIdx === i, dim: !!m.dim, idx: i, onClick: m.run }));
  if (menuNoteT > 0) { g.fillStyle = "#ffe066"; g.font = "bold 18px system-ui, sans-serif"; g.fillText(menuNote, W / 2, 482); }
  g.fillStyle = "rgba(255,255,255,.55)"; g.font = "14px system-ui, sans-serif";
  g.fillText("↑ ↓ choose · Enter select · N narrator · M mute", W / 2, 512);
}
function drawSettings() {
  g.fillStyle = "rgba(10,6,25,.95)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.fillStyle = "#ffe066"; g.font = "bold 44px system-ui, sans-serif"; g.fillText("Settings", W / 2, 96);
  const labels = { music: "Music", sfx: "Sound effects", narrator: "Narrator", sound: "Sound", controls: "Controls", back: "Back" };
  SETROWS.forEach((k, i) => {
    const x = W / 2 - 280, y = 120 + i * 58, w = 560, h = 52, sel = setIdx === i;
    g.save();
    g.fillStyle = sel ? "rgba(255,224,102,.18)" : "rgba(255,255,255,.07)";
    g.strokeStyle = sel ? "#ffe066" : "rgba(255,255,255,.2)"; g.lineWidth = 2;
    rr(x, y, w, h, 12); g.fill(); g.stroke();
    g.restore();
    g.textBaseline = "middle"; g.font = "bold 22px system-ui, sans-serif"; g.fillStyle = "#f4eefc";
    if (k === "back") { g.textAlign = "center"; g.fillText(labels[k], W / 2, y + h / 2); }
    else if (k === "music" || k === "sfx") {
      g.textAlign = "left"; g.fillText(labels[k], x + 22, y + h / 2);
      const tx = x + 250, tw = 220, ty = y + h / 2, v = settings[k];
      g.fillStyle = "rgba(255,255,255,.2)"; rr(tx, ty - 4, tw, 8, 4); g.fill();
      g.fillStyle = "#ffe066"; rr(tx, ty - 4, Math.max(8, tw * v), 8, 4); g.fill();
      g.fillStyle = "#ffffff"; g.beginPath(); g.arc(tx + tw * v, ty, 9, 0, 6.28); g.fill();
      g.textAlign = "right"; g.fillStyle = "#f4eefc"; g.fillText(`${Math.round(v * 100)}%`, x + w - 22, ty);
      hits.push({ x: tx - 12, y, w: tw + 24, h, drag: true, click: (px) => setSetting(k, (px - tx) / tw) });
    } else {
      g.textAlign = "left"; g.fillText(labels[k], x + 22, y + h / 2);
      g.textAlign = "right";
      g.fillText(k === "controls" ? SCHEMES[scheme].name : k === "narrator" ? (settings.narrator ? "On" : "Off") : (muted ? "Off" : "On"), x + w - 22, y + h / 2);
    }
    hits.push({ x, y, w, h, idx: i, click: () => { setIdx = i; if (k === "back") state = "menu"; else if (k === "narrator" || k === "sound" || k === "controls") adjustRow(k, 0); } });
  });
  g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillStyle = "rgba(255,255,255,.55)"; g.font = "14px system-ui, sans-serif";
  g.fillText("← → change · Enter toggle · Esc back", W / 2, 490);
}
function drawHelp() {
  g.fillStyle = "rgba(10,6,25,.95)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.fillStyle = "#ffe066"; g.font = "bold 44px system-ui, sans-serif"; g.fillText("How to play", W / 2, 84);
  let y = 124;
  g.textAlign = "left";
  for (const [label, lines] of HELP_FOR[scheme]) {
    g.fillStyle = "#ffe066"; g.font = "bold 16px system-ui, sans-serif"; g.fillText(label, 150, y);
    g.fillStyle = "#f4eefc"; g.font = "16px system-ui, sans-serif";
    lines.forEach((l, i) => g.fillText(l, 290, y + i * 20));
    y += lines.length * 20 + 8;
  }
  btn(W / 2 - 110, 452, 220, 48, "Back", { sel: true, onClick: () => { state = "menu"; } });
}
function drawOver() {
  g.fillStyle = "rgba(10,6,25,.75)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center";
  g.fillStyle = lastWin ? "#8fd17a" : "#ef476f"; g.font = "bold 56px system-ui, sans-serif";
  g.fillText(lastWin ? "You win!" : "CPU wins", W / 2, 190);
  g.fillStyle = "#ffffff"; g.font = "24px system-ui, sans-serif";
  g.fillText(`Score ${lastScore}`, W / 2, 250);
  g.fillText(`Knockouts ${player.kos}   ·   Stocks left ${Math.max(0, player.stocks)}`, W / 2, 290);
  g.fillStyle = "#cfc6e6"; g.font = "18px system-ui, sans-serif"; g.fillText(`Best ${bestRead()}`, W / 2, 330);
  g.fillStyle = "#ffe066"; g.font = "bold 22px system-ui, sans-serif"; g.fillText("Press Enter or click to play again · Esc for menu", W / 2, 400);
}

function draw() {
  hits.length = 0;
  g.save();
  if (shake > 0.3) g.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
  drawBackground(); drawPlatforms();
  drawItems(); drawFighter(player); drawFighter(ai);
  drawEffects();
  drawOverlays();
  if (state === "play" || state === "over" || state === "paused") drawHUD();
  g.restore();
  if (state === "menu") drawMenu();
  else if (state === "settings") drawSettings();
  else if (state === "pick") drawPick();
  else if (state === "paused") drawPaused();
  else if (state === "help") drawHelp();
  else if (state === "over") drawOver();
}

// ---- main loop: fixed 60 steps per second, drawn every frame
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { if (state === "play") update(); acc -= STEP; }
  if (menuNoteT > 0) menuNoteT--;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TPT Flappy Bird</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a1630;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Trebuchet MS", sans-serif;
  }
  canvas {
    height: 100vh; max-height: 100vh;
    aspect-ratio: 2 / 3;
    max-width: 100vw;
    background: #70c5ce;
    touch-action: none;
    user-select: none;
    box-shadow: 0 0 40px rgba(80,140,255,.35);
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Tunables ----------
  const GRAVITY       = 1500;
  const FLAP_VELOCITY = -420;
  const PIPE_SPEED    = 160;
  const PIPE_WIDTH    = 60;
  const PIPE_GAP      = 150;
  const PIPE_INTERVAL = 1.45;
  const GROUND_H      = 80;
  const BIRD_X        = 100;
  const BIRD_R        = 14;

  // TPT palette (from the logo)
  const NAVY  = '#071f4c';
  const BLUE  = '#74abe2';
  const PALE  = '#cfe6fa';

  // ---------- Persistent settings ----------
  let theme   = localStorage.getItem('flappyTheme') || 'tpt';   // 'classic' | 'tpt'
  let musicOn = localStorage.getItem('flappyMusic') !== 'off';
  let best    = +localStorage.getItem('flappyBest') || 0;
  const isTPT = () => theme === 'tpt';

  function setTheme(t) { theme = t; localStorage.setItem('flappyTheme', t); }
  function toggleMusic() {
    musicOn = !musicOn;
    localStorage.setItem('flappyMusic', musicOn ? 'on' : 'off');
    musicOn ? Music.start() : Music.stop();
  }

  // Optional: drop your real logo next to this file as "tpt-logo.png" and it will be used automatically.
  const logoImg = new Image();
  let logoLoaded = false;
  logoImg.onload = () => { logoLoaded = true; };
  logoImg.src = 'tpt-logo.png';

  // ---------- State ----------
  let state = 'ready';          // ready | playing | over
  let bird, pipes, score, spawnTimer, groundX, clouds, overTime, flash;
  let tm = 0;                   // global time for ambient animation
  const stars = Array.from({ length: 50 }, () => ({
    x: Math.random() * W, y: Math.random() * 330,
    r: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.28
  }));
  const orbs = Array.from({ length: 16 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: 1.5 + Math.random() * 3, v: 8 + Math.random() * 16, ph: Math.random() * 6.28
  }));

  function reset() {
    bird = { y: H / 2 - 30, vy: 0, rot: 0, wing: 0 };
    pipes = [];
    score = 0;
    spawnTimer = PIPE_INTERVAL - 0.5;
    groundX = 0;
    flash = 0;
    if (!clouds) {
      clouds = Array.from({ length: 5 }, () => ({
        x: Math.random() * W,
        y: 40 + Math.random() * 250,
        s: 0.6 + Math.random() * 0.8
      }));
    }
  }
  reset();

  // ---------- Audio ----------
  let audio;
  function getAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }

  function beep(freq, dur, type = 'square', vol = 0.06, slideTo) {
    try {
      const ac = getAudio();
      if (isTPT() && type === 'square') type = 'sine';
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const sFlap  = () => beep(400, 0.12, 'square', 0.05, 700);
  const sScore = () => { beep(880, 0.08, 'square', 0.05); setTimeout(() => beep(1320, 0.1, 'square', 0.05), 70); };
  const sHit   = () => beep(200, 0.3, 'sawtooth', 0.09, 50);

  // ---------- Ethereal generative music ----------
  // Slow evolving pads (Dmaj9 > Bm9 > Gmaj7 > Asus/add9) + soft bell notes through reverb and echo.
  const Music = (() => {
    const CHORD_LEN = 8;
    const CHORDS = [
      [50, 57, 61, 64, 69],   // D  A  C# E  A
      [47, 54, 59, 62, 66],   // B  F# B  D  F#
      [43, 50, 55, 59, 62],   // G  D  G  B  D
      [45, 52, 57, 61, 64]    // A  E  A  C# E
    ];
    const BELLS = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83, 86]; // D major pentatonic
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    let ac, out, dry, verbIn, delay, padBus, built = false;
    let timer = null, nextChordT = 0, nextBellT = 0, ci = 0;

    function build() {
      ac = getAudio();
      out = ac.createGain(); out.gain.value = 0;
      const comp = ac.createDynamicsCompressor();
      out.connect(comp); comp.connect(ac.destination);

      dry = ac.createGain(); dry.gain.value = 0.55; dry.connect(out);

      // Reverb from generated noise impulse
      const len = ac.sampleRate * 4.5;
      const buf = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
      const conv = ac.createConvolver(); conv.buffer = buf;
      verbIn = ac.createGain();
      const wet = ac.createGain(); wet.gain.value = 1.0;
      verbIn.connect(conv); conv.connect(wet); wet.connect(out);

      // Echo feeding the reverb
      delay = ac.createDelay(2); delay.delayTime.value = 0.62;
      const fb = ac.createGain(); fb.gain.value = 0.4;
      delay.connect(fb); fb.connect(delay); delay.connect(verbIn);

      // Pad bus with slowly sweeping lowpass
      padBus = ac.createGain();
      const filt = ac.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 1000; filt.Q.value = 0.6;
      const lfo = ac.createOscillator(), lfoG = ac.createGain();
      lfo.frequency.value = 0.06; lfoG.gain.value = 450;
      lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start();
      padBus.connect(filt); filt.connect(dry); filt.connect(verbIn);
      built = true;
    }

    function padNote(m, t) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.03, t + 3);
      g.gain.setValueAtTime(0.03, t + CHORD_LEN);
      g.gain.linearRampToValueAtTime(0, t + CHORD_LEN + 3.5);
      g.connect(padBus);
      [['sine', -5], ['triangle', 6]].forEach(([type, det]) => {
        const o = ac.createOscillator();
        o.type = type; o.frequency.value = mtof(m); o.detune.value = det;
        o.connect(g); o.start(t); o.stop(t + CHORD_LEN + 3.6);
      });
    }

    function bell(m, t, vol) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
      g.connect(dry); g.connect(delay); g.connect(verbIn);
      [[1, 1], [2.01, 0.25], [3.97, 0.08]].forEach(([mul, amp]) => {
        const o = ac.createOscillator(), og = ac.createGain();
        o.type = 'sine'; o.frequency.value = mtof(m) * mul; og.gain.value = amp;
        o.connect(og); og.connect(g); o.start(t); o.stop(t + 3.3);
      });
    }

    function tick() {
      const now = ac.currentTime;
      while (nextChordT < now + 2) {
        CHORDS[ci % CHORDS.length].forEach(m => padNote(m, nextChordT));
        padNote(CHORDS[ci % CHORDS.length][0] - 12, nextChordT); // deep root
        nextChordT += CHORD_LEN; ci++;
      }
      while (nextBellT < now + 1) {
        const m = BELLS[Math.floor(Math.random() * BELLS.length)];
        bell(m, nextBellT, 0.035 + Math.random() * 0.03);
        nextBellT += 0.55 + (Math.random() < 0.35 ? 0.7 : 0) + Math.random() * 0.4;
      }
    }

    return {
      start() {
        try {
          if (!built) build();
          getAudio();
          const now = ac.currentTime;
          out.gain.cancelScheduledValues(now);
          out.gain.setValueAtTime(out.gain.value, now);
          out.gain.linearRampToValueAtTime(0.8, now + 3);
          if (!timer) {
            nextChordT = nextBellT = now + 0.1; ci = 0;
            timer = setInterval(tick, 300); tick();
          }
        } catch (e) {}
      },
      stop() {
        if (!built) return;
        const now = ac.currentTime;
        out.gain.cancelScheduledValues(now);
        out.gain.setValueAtTime(out.gain.value, now);
        out.gain.linearRampToValueAtTime(0, now + 0.8);
        clearInterval(timer); timer = null;
      }
    };
  })();

  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    document.hidden ? audio.suspend() : audio.resume();
  });

  const gesture = () => { if (musicOn) Music.start(); };

  // ---------- Menu UI layout ----------
  const UI = {
    theme: { x: W / 2 - 100, y: 436, w: 200, h: 40 },
    music: { x: W / 2 - 100, y: 484, w: 200, h: 30 }
  };
  const hit = (b, x, y) => x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4;

  // ---------- Input ----------
  function flap() {
    if (state === 'ready') state = 'playing';
    if (state === 'playing') {
      bird.vy = FLAP_VELOCITY;
      sFlap();
    } else if (state === 'over' && performance.now() - overTime > 500) {
      reset();
      state = 'ready';
    }
  }
  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      gesture();
      if (!e.repeat) flap();
    } else if (e.code === 'KeyT' && !e.repeat) {
      setTheme(isTPT() ? 'classic' : 'tpt');
    } else if (e.code === 'KeyM' && !e.repeat) {
      toggleMusic();
    }
  });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'ready') {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * W / r.width;
      const y = (e.clientY - r.top) * H / r.height;
      if (hit(UI.theme, x, y)) {
        setTheme(x < UI.theme.x + UI.theme.w / 2 ? 'classic' : 'tpt');
        gesture(); return;
      }
      if (hit(UI.music, x, y)) { toggleMusic(); return; }
    }
    gesture();
    flap();
  });

  // ---------- Logic ----------
  function spawnPipe() {
    const margin = 60;
    const gapY = margin + PIPE_GAP / 2 + Math.random() * (H - GROUND_H - margin * 2 - PIPE_GAP);
    pipes.push({ x: W + 10, gapY, passed: false });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    state = 'over';
    overTime = performance.now();
    flash = 1;
    sHit();
    if (score > best) {
      best = score;
      localStorage.setItem('flappyBest', best);
    }
  }

  function update(dt) {
    tm += dt;
    clouds.forEach(c => {
      c.x -= 10 * c.s * dt;
      if (c.x < -80) { c.x = W + 80; c.y = 40 + Math.random() * 250; }
    });
    orbs.forEach(o => {
      o.y -= o.v * dt;
      o.x += Math.sin(tm + o.ph) * 6 * dt;
      if (o.y < -10) { o.y = H + 10; o.x = Math.random() * W; }
    });

    if (state !== 'over') groundX -= PIPE_SPEED * dt;
    bird.wing += dt * (state === 'over' ? 0 : 14);

    if (state === 'ready') {
      bird.y = H / 2 - 30 + Math.sin(performance.now() / 200) * 8;
      return;
    }

    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    const targetRot = Math.max(-0.45, Math.min(1.4, bird.vy / 600));
    bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 12);

    if (state === 'playing') {
      spawnTimer += dt;
      if (spawnTimer >= PIPE_INTERVAL) { spawnTimer = 0; spawnPipe(); }

      for (const p of pipes) {
        p.x -= PIPE_SPEED * dt;
        if (!p.passed && p.x + PIPE_WIDTH < BIRD_X - BIRD_R) {
          p.passed = true; score++; sScore();
        }
        const topH = p.gapY - PIPE_GAP / 2;
        const botY = p.gapY + PIPE_GAP / 2;
        if (circleRect(BIRD_X, bird.y, BIRD_R - 1, p.x, 0, PIPE_WIDTH, topH) ||
            circleRect(BIRD_X, bird.y, BIRD_R - 1, p.x, botY, PIPE_WIDTH, H - botY)) {
          die();
        }
      }
      pipes = pipes.filter(p => p.x > -PIPE_WIDTH - 10);

      if (bird.y - BIRD_R < -40) { bird.y = -40 + BIRD_R; bird.vy = 0; }
      if (bird.y + BIRD_R > H - GROUND_H) { bird.y = H - GROUND_H - BIRD_R; die(); }
    } else if (state === 'over') {
      if (bird.y + BIRD_R > H - GROUND_H) {
        bird.y = H - GROUND_H - BIRD_R;
        bird.vy = 0;
      }
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
  }

  // ---------- Logo (vector approximation of the TPT script "T") ----------
  function drawLogo(cx, top, size) {
    ctx.save();
    ctx.translate(cx - size / 2, top);
    ctx.scale(size / 400, size / 400);
    ctx.shadowColor = 'rgba(150,200,255,.6)';
    ctx.shadowBlur = 40;
    ctx.fillStyle = NAVY;
    ctx.beginPath(); ctx.roundRect(0, 0, 400, 400, 30); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.save();
    ctx.beginPath(); ctx.roundRect(0, 0, 400, 400, 30); ctx.clip();

    if (logoLoaded) {
      ctx.drawImage(logoImg, 0, 0, 400, 400);
    } else {
      // light blue sky
      ctx.fillStyle = BLUE;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(400, 0); ctx.lineTo(400, 55);
      ctx.bezierCurveTo(370, 85, 310, 75, 240, 55);
      ctx.bezierCurveTo(170, 35, 70, 25, 0, 72);
      ctx.closePath(); ctx.fill();

      // white ribbon that curls into the crossbar
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, 72);
      ctx.bezierCurveTo(70, 25, 170, 35, 240, 55);
      ctx.bezierCurveTo(310, 75, 370, 85, 400, 55);
      ctx.bezierCurveTo(370, 95, 300, 80, 230, 66);
      ctx.bezierCurveTo(150, 48, 70, 40, 25, 85);
      ctx.bezierCurveTo(10, 105, 15, 140, 45, 158);
      ctx.bezierCurveTo(90, 180, 190, 180, 290, 158);
      ctx.lineTo(292, 163);
      ctx.bezierCurveTo(200, 190, 80, 195, 30, 165);
      ctx.bezierCurveTo(-10, 140, -15, 100, 0, 72);
      ctx.closePath(); ctx.fill();

      // script T stem + loop
      ctx.beginPath();
      ctx.moveTo(245, 112);
      ctx.bezierCurveTo(200, 170, 150, 230, 150, 310);
      ctx.bezierCurveTo(150, 360, 190, 385, 240, 380);
      ctx.bezierCurveTo(300, 372, 345, 330, 345, 285);
      ctx.bezierCurveTo(345, 250, 310, 235, 275, 245);
      ctx.bezierCurveTo(240, 255, 215, 290, 212, 330);
      ctx.bezierCurveTo(225, 300, 250, 270, 285, 262);
      ctx.bezierCurveTo(320, 258, 330, 285, 320, 315);
      ctx.bezierCurveTo(305, 355, 270, 365, 235, 362);
      ctx.bezierCurveTo(190, 358, 170, 330, 172, 300);
      ctx.bezierCurveTo(175, 240, 215, 170, 252, 118);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  }

  // ---------- Drawing ----------
  function wave(base, amp, len, speed, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, base + Math.sin(x / len + tm * speed) * amp);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }

  function drawBackground() {
    if (isTPT()) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#061a45');
      g.addColorStop(0.5, '#16408a');
      g.addColorStop(0.85, BLUE);
      g.addColorStop(1, PALE);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // glowing moon
      const mg = ctx.createRadialGradient(W * 0.78, 120, 4, W * 0.78, 120, 130);
      mg.addColorStop(0, 'rgba(255,255,255,.55)');
      mg.addColorStop(0.15, 'rgba(200,225,255,.25)');
      mg.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = mg; ctx.fillRect(0, 0, W, 300);

      // twinkling stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.75 * Math.abs(Math.sin(tm * 1.2 + s.ph))})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      });

      // soft misty wisps
      clouds.forEach(c => {
        ctx.save();
        ctx.translate(c.x + 30, c.y);
        ctx.scale(1, 0.32);
        const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 80 * c.s);
        cg.addColorStop(0, 'rgba(220,235,255,.35)');
        cg.addColorStop(1, 'rgba(220,235,255,0)');
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(0, 0, 80 * c.s, 0, 6.283); ctx.fill();
        ctx.restore();
      });

      // floating light orbs
      ctx.save();
      ctx.shadowColor = '#bfe0ff'; ctx.shadowBlur = 12;
      orbs.forEach(o => {
        ctx.fillStyle = `rgba(220,240,255,${0.15 + 0.3 * Math.abs(Math.sin(tm + o.ph))})`;
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.283); ctx.fill();
      });
      ctx.restore();

      // layered waves echoing the logo swoosh
      wave(H - GROUND_H - 70, 10, 38, 0.6, 'rgba(10,40,100,.45)');
      wave(H - GROUND_H - 38, 8, 26, -0.8, 'rgba(7,31,76,.75)');
      return;
    }

    // Classic
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4ec0ca');
    g.addColorStop(1, '#bfeaf0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,.75)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 24 * c.s, c.y + 4 * c.s, 28 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 52 * c.s, c.y, 20 * c.s, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = '#a5dba5';
    for (let i = 0; i < 10; i++) {
      const bw = 44, bh = 40 + ((i * 53) % 50);
      ctx.fillRect(i * bw - 10, H - GROUND_H - bh, bw - 4, bh);
    }
  }

  function drawPipe(p) {
    const topH = p.gapY - PIPE_GAP / 2;
    const botY = p.gapY + PIPE_GAP / 2;
    const capH = 24, capExtra = 4;

    const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_WIDTH, 0);
    if (isTPT()) {
      grad.addColorStop(0, '#0a2a66');
      grad.addColorStop(0.4, '#2f6bc4');
      grad.addColorStop(1, '#051a47');
      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = '#9cc7f0';
      ctx.shadowBlur = 12;
      ctx.lineWidth = 2.5;
    } else {
      grad.addColorStop(0, '#5aa31d');
      grad.addColorStop(0.35, '#8fe04a');
      grad.addColorStop(1, '#4a8a14');
      ctx.strokeStyle = '#2d5a0c';
      ctx.lineWidth = 3;
    }
    ctx.fillStyle = grad;

    ctx.fillRect(p.x, 0, PIPE_WIDTH, topH - capH);
    ctx.strokeRect(p.x, -3, PIPE_WIDTH, topH - capH + 3);
    ctx.fillRect(p.x - capExtra, topH - capH, PIPE_WIDTH + capExtra * 2, capH);
    ctx.strokeRect(p.x - capExtra, topH - capH, PIPE_WIDTH + capExtra * 2, capH);

    ctx.fillRect(p.x, botY + capH, PIPE_WIDTH, H - botY);
    ctx.strokeRect(p.x, botY + capH, PIPE_WIDTH, H - botY);
    ctx.fillRect(p.x - capExtra, botY, PIPE_WIDTH + capExtra * 2, capH);
    ctx.strokeRect(p.x - capExtra, botY, PIPE_WIDTH + capExtra * 2, capH);
    ctx.shadowBlur = 0;
  }

  function drawGround() {
    const y = H - GROUND_H;

    if (isTPT()) {
      const wy = x => y + Math.sin((x - groundX) / 28) * 4;
      ctx.fillStyle = NAVY;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, wy(x));
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

      ctx.lineCap = 'round';
      ctx.strokeStyle = BLUE; ctx.globalAlpha = 0.7; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) x ? ctx.lineTo(x, wy(x) + 12) : ctx.moveTo(x, wy(x) + 12);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
      ctx.shadowColor = '#bfe0ff'; ctx.shadowBlur = 10;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) x ? ctx.lineTo(x, wy(x)) : ctx.moveTo(x, wy(x));
      ctx.stroke();
      ctx.shadowBlur = 0;
      return;
    }

    const gx = groundX % 24;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, y, W, GROUND_H);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, y, W, 16);
    ctx.fillStyle = '#5da322';
    for (let x = gx - 24; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 12, y);
      ctx.lineTo(x, y + 16);
      ctx.lineTo(x - 12, y + 16);
      ctx.fill();
    }
    ctx.fillStyle = '#2d5a0c';
    ctx.fillRect(0, y, W, 3);
    ctx.fillStyle = '#c8b560';
    ctx.fillRect(0, y + 16, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);
    const tpt = isTPT();

    if (tpt) { ctx.shadowColor = '#bfe0ff'; ctx.shadowBlur = 16; }
    ctx.fillStyle = tpt ? '#ffffff' : '#f8d030';
    ctx.strokeStyle = tpt ? NAVY : '#533';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_R + 3, BIRD_R, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = tpt ? PALE : '#fbe98a';
    ctx.beginPath();
    ctx.ellipse(-2, 5, 9, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const flapY = Math.sin(bird.wing) * 4;
    ctx.fillStyle = tpt ? BLUE : '#e8a820';
    ctx.beginPath();
    ctx.ellipse(-6, 2 + flapY, 8, 5, -0.3 + flapY * 0.05, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7, -5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = tpt ? NAVY : '#000';
    ctx.beginPath(); ctx.arc(9, -5, 2, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = tpt ? '#4a8fd8' : '#f05a28';
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(21, 3); ctx.lineTo(10, 8); ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  function text(str, x, y, size, align = 'center') {
    ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`;
    ctx.textAlign = align;
    ctx.lineJoin = 'round';
    ctx.lineWidth = size / 5;
    ctx.strokeStyle = isTPT() ? NAVY : '#333';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = '#fff';
    ctx.fillText(str, x, y);
  }

  function pill(b, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, r); ctx.fill();
  }

  function drawMenuButtons() {
    const tpt = isTPT();
    const t = UI.theme, half = t.w / 2;
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    pill(t, 20, 'rgba(0,0,0,.4)');
    ctx.beginPath(); ctx.roundRect(t.x, t.y, t.w, t.h, 20); ctx.stroke();

    ctx.fillStyle = tpt ? BLUE : '#f8d030';
    ctx.beginPath();
    ctx.roundRect(t.x + (tpt ? half : 0) + 3, t.y + 3, half - 6, t.h - 6, 17);
    ctx.fill();

    ctx.font = 'bold 16px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = tpt ? '#fff' : NAVY;
    ctx.fillText('Classic', t.x + half / 2, t.y + t.h / 2 + 1);
    ctx.fillStyle = tpt ? NAVY : '#fff';
    ctx.fillText('TPT', t.x + half * 1.5, t.y + t.h / 2 + 1);

    const m = UI.music;
    pill(m, 15, 'rgba(0,0,0,.4)');
    ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, m.h, 15); ctx.stroke();
    ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
    ctx.fillStyle = musicOn ? '#fff' : 'rgba(255,255,255,.55)';
    ctx.fillText('♪ Music: ' + (musicOn ? 'On' : 'Off'), m.x + m.w / 2, m.y + m.h / 2 + 1);
    ctx.restore();
  }

  function drawUI() {
    const tpt = isTPT();
    if (state === 'playing') {
      text(score, W / 2, 90, 54);
    } else if (state === 'ready') {
      if (tpt) {
        drawLogo(W / 2, 34, 104);
        text('TPT Flappy Bird', W / 2, 190, 38);
      } else {
        text('Flappy Bird', W / 2, 150, 46);
      }
      text('Tap / Space to flap', W / 2, 360, 22);
      if (best) text('Best: ' + best, W / 2, 395, 20);
      drawMenuButtons();
    } else if (state === 'over') {
      text('Game Over', W / 2, 150, 46);
      const px = W / 2 - 100, py = 200, pw = 200, ph = 130;
      ctx.fillStyle = tpt ? '#0b2a63' : '#ded895';
      ctx.strokeStyle = tpt ? '#fff' : '#533';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, 10);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = tpt ? BLUE : '#d96a2b';
      ctx.font = 'bold 16px "Trebuchet MS"';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE', px + 18, py + 32);
      ctx.fillText('BEST', px + 18, py + 82);
      text(score, px + pw - 18, py + 62, 34, 'right');
      text(best, px + pw - 18, py + 112, 34, 'right');
      if (score >= best && score > 0) {
        ctx.fillStyle = tpt ? PALE : '#e33';
        ctx.font = 'bold 14px "Trebuchet MS"';
        ctx.textAlign = 'center';
        ctx.fillText('NEW BEST!', W / 2, py + ph + 24);
      }
      if (performance.now() - overTime > 500) text('Tap / Space to retry', W / 2, 410, 22);
    }
  }

  function draw() {
    drawBackground();
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();
    drawUI();
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>

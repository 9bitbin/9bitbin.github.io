<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Constellation — Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef0ff;--muted:#9aa0c3;--faint:#7c81b0;--glass:rgba(18,16,40,.6);--edge:rgba(255,255,255,.09);--dark:#07051a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Manrope,system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 15% -10%,rgba(124,58,237,.3),transparent 60%),radial-gradient(1000px 600px at 100% 10%,rgba(67,56,202,.25),transparent 60%),radial-gradient(900px 700px at 50% 120%,rgba(109,40,217,.2),transparent 60%),#05040d;background-attachment:fixed}
main{max-width:1400px;margin:0 auto;padding:26px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font:700 1.45rem Unbounded;margin:0;background:linear-gradient(100deg,#fff,#c4b5fd,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.login{max-width:380px;margin:10vh auto 0}
.login h2{font:500 1.1rem Unbounded;margin:0 0 6px}
label{display:block;font:600 .7rem Manrope;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input,select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.04);color:var(--ink);font:500 .92rem Manrope;outline:0}
select option{background:#120f28}
input:focus,select:focus{border-color:rgba(196,181,253,.6)}
button{font:700 .82rem Manrope;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--ink);transition:.2s}
button:hover:not(:disabled){border-color:rgba(255,255,255,.3)}
button:disabled{opacity:.35;cursor:default}
button.primary{border:0;color:var(--dark);background:linear-gradient(110deg,#c7d2fe,#a78bfa,#e9d5ff);width:100%;margin-top:20px;padding:13px}
:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
.msg{margin-top:12px;font-size:.85rem;color:#fda4af;min-height:1.2em}
.muted{color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab.on{background:#c4b5fd;color:var(--dark);border-color:transparent}
.k{font:700 .66rem Manrope;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:1px solid var(--edge);font-size:.76rem;color:var(--muted)}
.pill.on{color:var(--ink);border-color:#c4b5fd}
.pill.warn{color:#fda4af;border-color:rgba(253,164,175,.45)}
.fitb{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:800;font-size:.76rem;white-space:nowrap}
.f1,.f2{background:rgba(244,63,94,.16);color:#fda4af}.f3{background:rgba(234,179,8,.16);color:#fde047}.f4,.f5{background:rgba(34,197,94,.16);color:#86efac}
.fchip{display:inline-block;font:800 .74rem Unbounded;color:var(--dark);background:var(--c);border-radius:999px;padding:2px 8px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:16px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--edge)}
.kv{font:800 1.7rem Unbounded}.kl{font:700 .7rem Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}.ks{font-size:.76rem;color:var(--faint);margin-top:4px}
.ogrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.ogrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ocol{display:grid;gap:14px;align-content:start}
.ph{font:700 .9rem Unbounded;margin-bottom:2px}.phs{font-size:.78rem;color:var(--muted);margin-bottom:10px;line-height:1.45}
.chart{width:100%;height:auto;display:block}
.chart .cl{fill:#9aa0c3;font:600 11px Manrope}.chart .cv{fill:#eef0ff;font:700 11px Manrope}.chart .axis{stroke:rgba(255,255,255,.15)}
.mix{display:flex;flex-wrap:wrap;gap:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font:700 .64rem Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--edge);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.mm{list-style:none;margin:0;padding:0}.mm li{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}.mm li:last-child{border:0}
/* results: list + detail */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.listcol{position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;padding:12px}
#listTools{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
#listCount{font-size:.74rem;color:var(--faint);padding:0 4px 6px}
.acb{display:inline-block;font:700 .66rem Manrope;color:#c4b5fd;background:rgba(196,181,253,.12);border:1px solid rgba(196,181,253,.35);border-radius:999px;padding:1px 7px;vertical-align:middle;margin-left:4px}
.acb.big{font-size:.78rem;padding:3px 10px;margin:0}.acb.none{color:var(--faint);background:none;border-color:rgba(255,255,255,.12);margin:0}
.acline{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.acall{background:none;border:0;color:var(--muted);font:600 .82rem Manrope;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}.acall:hover{color:var(--ink)}
#list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.li{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--edge);border-left:3px solid var(--c)}
.li.on{background:rgba(196,181,253,.12);border-color:rgba(196,181,253,.5);border-left-color:var(--c)}
.li .lt{font:800 .8rem Unbounded;color:var(--c);min-width:44px}
.li .lm{flex:1;min-width:0;display:flex;flex-direction:column}.li .lm b{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .lm i{font-style:normal;font-size:.74rem;color:var(--muted)}
#detail{display:grid;gap:14px;min-width:0}
.dhead{display:flex;justify-content:space-between;gap:8px}
.back{display:none}
.dnav{display:flex;gap:6px;margin-left:auto}
.dtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dname{font:700 1.5rem Unbounded;overflow-wrap:anywhere}
.dtype{font:900 2.6rem Unbounded;line-height:1}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.fbbox{font-size:.88rem;line-height:1.7}.fbnote{margin-top:4px;color:#d6d8f2;font-style:italic}
.maps{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px}
.dgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mapsvg{width:100%;height:auto;display:block;overflow:visible}
.xq{fill:rgba(255,255,255,.02);stroke:rgba(255,255,255,.08)}
.xh{fill:#9aa0c3;font:700 13px Manrope;letter-spacing:.2em;text-anchor:middle}
.xs{fill:#7c81b0;font:600 10px Manrope;letter-spacing:.22em}
.xl{fill:#7c81b0;font:600 11px Manrope;letter-spacing:.14em;text-anchor:middle;text-transform:uppercase}
.qaxis{stroke:rgba(255,255,255,.14);stroke-width:2;stroke-dasharray:6 8}.qaxis.on{stroke:rgba(255,255,255,.6);stroke-dasharray:0}
.cx{stroke:rgba(255,255,255,.4);stroke-width:2.5;stroke-dasharray:6 7}
.svl{stroke:var(--sc);stroke-width:7;stroke-linecap:round;opacity:.8;filter:drop-shadow(0 0 10px var(--sc))}
.ctx{fill:#eef0ff;font:800 17px Manrope;letter-spacing:.06em;text-anchor:middle}
.xnode .body{fill:var(--c)}
.xnode.int .body{stroke:rgba(7,5,26,.25);stroke-width:1.5}.xnode.ext .body{stroke:#fff;stroke-width:4}
.xnode .halo{fill:var(--c);opacity:.14}
.xnode .ring{fill:none;stroke:var(--c);stroke-width:2.5;stroke-dasharray:4 5}
.xnode.faded{opacity:.4}
.xnode .fx{fill:#07051a;font:900 24px Unbounded;text-anchor:middle;dominant-baseline:middle}
.xnode .fk{fill:rgba(7,5,26,.78);font:800 8.5px Manrope;letter-spacing:.14em;text-anchor:middle}
.xnode .rk{fill:rgba(7,5,26,.85);font:800 8px Manrope;letter-spacing:.12em;text-anchor:middle}
/* animation (matches the quiz and glossary maps) */
.mapsvg .pop{transform-box:view-box;transform-origin:0 0;animation:popin .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.mapsvg .ring{transform-box:fill-box;transform-origin:center;animation:spinr 14s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.mapsvg .svl{stroke-dasharray:700;stroke-dashoffset:700;animation:drawl 1s .45s ease-out forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
.mapsvg .cx,.mapsvg .qaxis,.mapsvg .ctx{animation:fadein .6s .35s both}
@keyframes fadein{from{opacity:0}}
.mapsvg .xnode{cursor:default}.mapsvg .xnode:hover .halo{opacity:.32}
.c2bar{transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fpath .pbub::before{animation:popin .6s cubic-bezier(.3,1.5,.5,1) both}
@media (prefers-reduced-motion:reduce){.mapsvg .pop,.mapsvg .ring,.mapsvg .svl,.mapsvg .cx,.mapsvg .qaxis,.mapsvg .ctx,.c2bar,.fpath .pbub::before{animation:none}.mapsvg .svl{stroke-dashoffset:0}}
/* flow */
.fpath{list-style:none;margin:0;padding:0}
.fpath li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--edge)}.fpath li:last-child{border:0}
.pbub{flex:none;width:52px;height:52px;display:grid;place-items:center;font:900 .76rem Unbounded;color:var(--dark)}
.pbub::before{content:"";grid-area:1/1;width:var(--d);height:var(--d);border-radius:50%;background:var(--c)}
.pbub.e::before{box-shadow:0 0 0 3px #fff inset}.pbub span{grid-area:1/1;position:relative}
.ptxt{flex:1;min-width:0}.pk{font:700 .64rem Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}.pq{font:600 .94rem Manrope;margin-top:2px}
.ptag{font:700 .7rem Manrope;padding:4px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap}
.fpath li.sv .ptag{color:#86efac;border-color:rgba(134,239,172,.45);background:rgba(34,197,94,.1)}
.fpath li.bl .ptag{color:#fda4af;border-color:rgba(253,164,175,.45);background:rgba(244,63,94,.1)}
/* coins */
.c2grid{display:grid;gap:4px}
.c2h{font:700 .62rem Manrope;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:6px 0 2px}
.coin2{padding:7px 0}
.c2top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86rem;margin-bottom:5px}.c2top b{font-weight:800}
.c2tag{font:700 .64rem Manrope;padding:2px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap}
.c2tag.c2-strong{color:var(--ink);border-color:rgba(196,181,253,.6);background:rgba(196,181,253,.14)}
.c2bar{display:flex;height:9px;border-radius:999px;overflow:hidden;gap:2px}.c2bar i{display:block;height:100%}
.c2ends{display:flex;justify-content:space-between;font-size:.7rem;color:var(--faint);margin-top:3px}
/* insights */
.igrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:12px}
.pat{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 12px;font-size:.88rem}.pat dt{color:var(--muted)}.pat dd{margin:0;display:flex;flex-wrap:wrap;gap:4px}
.notes{margin:0 0 12px;padding-left:18px;font-size:.88rem;line-height:1.6;color:#d6d8f2}.notes li{margin-bottom:4px}
.tps{display:flex;flex-wrap:wrap;gap:6px}
.gb{padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--edge);border-left:3px solid var(--c);font-size:.86rem;line-height:1.55;color:#d6d8f2}.gb b{display:block;color:var(--c);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
/* answers */
.sfil{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:6px 12px;font-weight:600}.chip i{font-style:normal;color:var(--faint);margin-left:4px}.chip.on{background:rgba(196,181,253,.16);border-color:#c4b5fd}
ol.ans{margin:0;padding-left:24px;font-size:.88rem;line-height:1.55}
ol.ans li{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05)}
ol.ans .q{color:var(--muted);margin-bottom:4px}.ol.ans .a{color:var(--ink)}
.why{font-size:.74rem;color:#e9d5ff;border:1px solid rgba(196,181,253,.35);border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.dis{font-size:.76rem;color:var(--faint);margin-top:3px}
.danger{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px}
.del{color:#fda4af;border-color:rgba(253,164,175,.4)}.del:hover:not(:disabled){background:rgba(244,63,94,.14)}
/* item health */
tr.flag td{background:rgba(253,164,175,.05)}
/* responsive */
@media (max-width:1100px){.maps,.dgrid2,.igrid{grid-template-columns:1fr}.ogrid,.ogrid.two{grid-template-columns:1fr}}
@media (max-width:900px){
  main{padding:18px 12px 40px}
  .split{grid-template-columns:minmax(0,1fr)}
  #detail{grid-template-columns:minmax(0,1fr)}
  #detail .panel{min-width:0;overflow-wrap:anywhere}
  .listcol{position:static;max-height:none}
  #detail{display:none}
  #resultsView.showdetail .listcol{display:none}
  #resultsView.showdetail #detail{display:grid}
  .back{display:inline-flex}
  .dtype{font-size:2rem}.dname{font-size:1.2rem}
  .cardable table,.cardable tbody,.cardable tr,.cardable td{display:block;width:100%}
  .cardable thead{display:none}
  .cardable #itbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
  .cardable td{padding:0;border:0;min-width:0;overflow-wrap:anywhere}
  .cardable td[data-l]::before{content:attr(data-l);display:block;font:600 .6rem Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .cardable td.i-q,.cardable td.i-flag{grid-column:1/-1}
  .pat{grid-template-columns:1fr}.pat dt{margin-top:4px}
  table.mini th,table.mini td{padding:7px 6px}
}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Constellation results</h1><div class="sub" id="who">Owner view</div></div>
    <div class="tools" id="tools" hidden><button id="refresh">Refresh</button><button id="logout">Log out</button></div>
  </header>

  <section id="loginView" class="panel login">
    <h2>Owner login</h2>
    <div class="sub">Use the Supabase Auth user you created for yourself.</div>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </section>

  <div id="app" hidden>
    <nav class="tabs" aria-label="Views"><button class="tab on" data-v="overview">Overview</button><button class="tab" data-v="results">Results</button><button class="tab" data-v="items">Item health</button></nav>
    <section id="overView"></section>
    <section id="resultsView" hidden>
      <div class="split">
        <div class="panel listcol">
          <div id="listTools">
            <input id="filter" placeholder="Filter by name, type, subtype or @account" aria-label="Filter results">
            <select id="acctSel" aria-label="Account filter"><option value="all">All results</option><option value="yes">With an account</option><option value="no">No account</option></select>
            <select id="sortSel" aria-label="Sort results"><option value="created_at:-1">Newest first</option><option value="created_at:1">Oldest first</option><option value="name:1">Name A–Z</option><option value="type:1">Type</option><option value="fit:-1">Best fit</option><option value="fit:1">Worst fit</option><option value="consistency:-1">Most consistent</option><option value="type_prob:-1">Most confident</option></select>
          </div>
          <div id="listCount"></div>
          <div id="list" role="list"></div>
        </div>
        <div id="detail" aria-live="polite"></div>
      </div>
    </section>
    <section id="itemsView" class="panel cardable" hidden><div class="sub" id="itemsSum" style="margin:0 0 12px"></div><table><thead><tr><th>Item</th><th>Scene</th><th>Takes</th><th>Top #1 pick</th><th>None fit</th><th>"Should"</th><th>Flags</th></tr></thead><tbody id="itbody"></tbody></table></section>
  </div>
</main>
<script>
const FN = {
  Ni:{OI:1,NS:1,N:1,  kind:'O',att:'i'}, Se:{OI:-1,NS:1,N:-1, kind:'O',att:'e'},
  Si:{OI:1,NS:-1,N:-1,kind:'O',att:'i'}, Ne:{OI:-1,NS:-1,N:1, kind:'O',att:'e'},
  Fi:{DI:1,FT:1,T:-1, kind:'D',att:'i'}, Te:{DI:-1,FT:1,T:1,  kind:'D',att:'e'},
  Ti:{DI:1,FT:-1,T:1, kind:'D',att:'i'}, Fe:{DI:-1,FT:-1,T:-1,kind:'D',att:'e'}
};
const STACKS = {
  ISTJ:["Si","Te","Fi","Ne"], ISFJ:["Si","Fe","Ti","Ne"], INFJ:["Ni","Fe","Ti","Se"], INTJ:["Ni","Te","Fi","Se"],
  ISTP:["Ti","Se","Ni","Fe"], ISFP:["Fi","Se","Ni","Te"], INFP:["Fi","Ne","Si","Te"], INTP:["Ti","Ne","Si","Fe"],
  ESTP:["Se","Ti","Fe","Ni"], ESFP:["Se","Fi","Te","Ni"], ENFP:["Ne","Fi","Te","Si"], ENTP:["Ne","Ti","Fe","Si"],
  ESTJ:["Te","Si","Ne","Fi"], ESFJ:["Fe","Si","Ne","Ti"], ENFJ:["Fe","Ni","Se","Ti"], ENTJ:["Te","Ni","Se","Fi"]
};
const COINS = ['OD','DI','OI','N','T','FT','NS','IE'];

function animalOf(o, d){ // savior observer + savior decider
  const oi = FN[o].att==='i', di = FN[d].att==='i';
  if (oi && di) return 'Sleep';
  if (!oi && di) return 'Consume';
  if (oi && !di) return 'Blast';
  return 'Play';
}

// Build the 32 subtypes (dom + one other savior)
const SUBTYPES = [];
for (const o of ['Ni','Ne','Si','Se']) for (const d of ['Fi','Fe','Ti','Te']) for (const lead of ['O','D']) {
  const dom = lead==='O'? o : d, other = lead==='O'? d : o;
  let type=null, pos=null;
  for (const t in STACKS){ const s=STACKS[t]; if (s[0]===dom && (s[1]===other||s[2]===other)) { type=t; pos = s[1]===other? 'aux':'tert'; } }
  const sign = {OD: lead==='O'?1:-1, IE: FN[dom].att==='i'?1:-1};
  for (const c of ['DI','FT','T']) sign[c]=FN[d][c];
  for (const c of ['OI','NS','N']) sign[c]=FN[o][c];
  SUBTYPES.push({key:dom+'-'+other, dom, other, obs:o, dec:d, type, pos, sign, animal: animalOf(o,d)});
}
const FCOLOR = { Fi:'#f43f5e', Fe:'#fda4af', Ti:'#3b82f6', Te:'#93c5fd', Si:'#22c55e', Se:'#86efac', Ni:'#eab308', Ne:'#fde047' };
const FINK = '#07051a'; // label text color inside function bubbles (dark text passes AA on every fill)
const FNAME = { Ni:'Introverted Intuition', Ne:'Extroverted Intuition', Si:'Introverted Sensing', Se:'Extroverted Sensing',
  Ti:'Introverted Thinking', Te:'Extroverted Thinking', Fi:'Introverted Feeling', Fe:'Extroverted Feeling' };
const FDESC = {
  Ni:{ core:"Keeps stacking patterns onto a personal worldview, and pushes away new facts that don't connect back to it. Narrows everything down to one concept.", void:"Leaves others asking for the facts and details, and wondering whether you've seen the new information.", fear:"New facts collapse the abstract worldview you've built in your head."},

const SIZES=[1.28,1.04,.84,.62], OFF=.46;
function nodeSvg(f,x,y,scale,{rank=-1,savior=false,faded=false}={}){

}
// Stack cluster: #1 and #2 on top (introverted left), #3 and #4 below on the diagonals; glowing line joins the saviors.
function stackSvg(type,key){

  const L=[st[0],st[1]].find(f=>FN[f].att==='i'), R=[st[0],st[1]].find(f=>f!==L);
  const P={[L]:[285,195],[R]:[515,195],[PARTNER[R]]:[345,390],[PARTNER[L]]:[455,390]};

  return `<svg viewBox="160 70 480 470" class="mapsvg" role="img" aria-label="${type} stack">${ln(L,PARTNER[L],'cx')}${ln(R,PARTNER[R],'cx')}${ln(sub.dom,sub.other,'svl',`style="--sc:${FCOLOR[sub.dom]}"`)}
    ${[3,2,1,0].map(i=>nodeSvg(st[i],P[st[i]][0],P[st[i]][1],sc(i),{rank:i,savior:sv.includes(st[i])})).join('')}
    <text class="ctx" x="400" y="528">${jump?`Jumper: ${sub.dom} (#1) + ${sub.other} (#3)`:`Balanced: ${sub.dom} (#1) + ${sub.other} (#2)`}</text></svg>`;

    <div class="panel"><div class="k" style="margin-bottom:0">Insights</div>${insightsHtml(r)}</div>`:'<div class="panel muted">This result has an unknown type, so maps are not available.</div>'}
    <div class="panel"><div class="k">Answers</div>${answersHtml(r)}</div>
    <div class="danger" id="danger"><button class="del" id="delBtn">Delete this result</button><span class="muted">Browser ID ${esc((r.client_id||'—').slice(0,8))} · ${esc(r.quiz_version||'')}</span></div>`;
  $('#backBtn').addEventListener('click',()=>$('#resultsView').classList.remove('showdetail'));
  const ac=$('#acAll'); if(ac) ac.addEventListener('click',()=>{ $('#filter').value='@'+r.username; $('#acctSel').value='all'; renderList(); });
  $('#prevBtn').addEventListener('click',()=>step(-1)); $('#nextBtn').addEventListener('click',()=>step(1));
  $$('#detail .sfil .chip').forEach(b=>b.addEventListener('click',()=>{ sceneFilter=b.dataset.s; renderDetail(); }));
  $('#delBtn').addEventListener('click',()=>{
    $('#danger').innerHTML=`<span>Delete <b>${esc(r.name||'this')}</b>'s result and feedback? This can't be undone.</span><button class="del" id="delYes">Delete</button><button id="delNo">Cancel</button><span class="msg" id="delMsg"></span>`;
    $('#delNo').addEventListener('click',renderDetail);
    $('#delYes').addEventListener('click',async()=>{ $('#delYes').disabled=true; $('#delMsg').textContent='Deleting…';
      try{ await deleteResult(r.id); const l=filtered(), i=l.findIndex(x=>x.id===r.id); rows=rows.filter(x=>x.id!==r.id); const nl=filtered(); selId=nl.length?nl[Math.min(i,nl.length-1)].id:null; render(); }
      catch(e){ $('#delMsg').textContent=e.message; $('#delYes').disabled=false; } });
  });
}

/* ================= ITEM HEALTH (unchanged logic) ================= */
function itemHealth(){
  const st={}; let takes=0;
  rows.filter(r=>Array.isArray(r.answers)&&r.answers.length&&r.answers[0].scenario!==undefined).forEach(r=>{ takes++;
    r.answers.forEach(a=>{ const s=st[a.item_id]=st[a.item_id]||{id:a.item_id,scen:a.scenario,q:a.q,n:0,none:0,should:0,picks:{}};
      s.n++; if(a.none_fit) s.none++; else if(a.picked){ s.picks[a.picked]=(s.picks[a.picked]||0)+1; } if(a.second){ s.seconds=s.seconds||{}; s.seconds[a.second]=(s.seconds[a.second]||0)+1; } if(a.why==='ideal') s.should++; }); });
  const list=Object.values(st).map(s=>{ const answered=s.n-s.none; const top=Object.entries(s.picks).sort((a,b)=>b[1]-a[1])[0]||['—',0];
    const topShare=answered?top[1]/answered:0, noneShare=s.n?s.none/s.n:0, flags=[];
    if(s.n>=5 && topShare>0.6) flags.push(`One option gets ${Math.round(topShare*100)}%`);
    if(s.n>=5 && noneShare>0.25) flags.push(`"None fit" at ${Math.round(noneShare*100)}%`);
    return {...s, top:top[0], topShare, noneShare, flags}; }).sort((a,b)=>b.flags.length-a.flags.length || b.n-a.n);
  $('#itemsSum').textContent = takes? `${takes} v2 takes · ${list.length} items seen · ${list.filter(x=>x.flags.length).length} flagged (flags need 5+ answers)` : 'No v2 takes yet.';
  $('#itbody').innerHTML = list.map(s=>`<tr class="${s.flags.length?'flag':''}"><td class="i-q" data-l="Item"><div style="font-size:.84rem">${esc(s.q)}</div><div class="muted" style="font-size:.72rem">${esc(s.id)}</div></td>
    <td class="muted" data-l="Scene">${esc(SC[s.scen]||s.scen)}</td><td data-l="Takes">${s.n}</td><td data-l="Top #1 pick">${fchip(s.top)} ${Math.round(s.topShare*100)}%${s.seconds?`<div class="muted" style="font-size:.72rem">Top #2: ${esc(Object.entries(s.seconds).sort((a,b)=>b[1]-a[1])[0][0])}</div>`:''}</td>
    <td data-l="None fit">${Math.round(s.noneShare*100)}%</td><td data-l="&quot;Should&quot;">${s.should}</td><td class="i-flag" data-l="Flags">${s.flags.map(f=>`<span class="pill warn">${esc(f)}</span>`).join(' ')||'<span class="muted">OK</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Nothing yet.</td></tr>';
}

/* ================= VIEW SWITCHING ================= */
function setView(v){ view=v; $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('#overView').hidden=v!=='overview'; $('#resultsView').hidden=v!=='results'; $('#itemsView').hidden=v!=='items';
  $('#listTools').hidden=v!=='results'; }
function render(){ renderOverview(); renderList(); itemHealth(); }
$$('.tab').forEach(t=>t.addEventListener('click',()=>setView(t.dataset.v)));
$('#filter').addEventListener('input',renderList);
$('#acctSel').addEventListener('change',renderList);
$('#sortSel').addEventListener('change',e=>{ const [k,d]=e.target.value.split(':'); sortK=k; sortDir=+d; renderList(); });
$('#refresh').addEventListener('click',()=>fetchRows().catch(e=>alertMsg(e)));
$('#logout').addEventListener('click',()=>logout());
document.addEventListener('keydown',e=>{ if(view!=='results'||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); step(1); } if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); step(-1); } });
function alertMsg(e){ $('#overView').innerHTML=`<div class="panel empty">${esc(e.message||e)}</div>`; }
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('#loginMsg').textContent='';
  if(/YOUR-PROJECT|YOUR-ANON/.test(SUPABASE_URL+SUPABASE_ANON_KEY)){ $('#loginMsg').textContent='Add your Supabase URL and anon key at the top of the script in admin.html first.'; return; }
  try{ session=await login($('#email').value.trim(),$('#pw').value); store(session); showApp(); await fetchRows(); }
  catch(err){ $('#loginMsg').textContent=err.message; }
});
const saved=load(); if(saved&&saved.exp>Date.now()){ session=saved; showApp(); fetchRows().catch(alertMsg); }
window.__admin={rows:()=>rows,setView,step};

</script>
